name: Build Semantorium (Linux + macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libfontconfig1 libfreetype6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m PyInstaller Semantorium.spec --noconfirm

      - name: Create portable archive
        run: |
          cd dist
          tar -czf Semantorium-Linux-x86_64.tar.gz Semantorium
          ls -lh Semantorium-Linux-x86_64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semantorium-Linux-x86_64
          path: dist/Semantorium-Linux-x86_64.tar.gz

  build-macos-x86_64:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller Semantorium.spec --noconfirm

      - name: Create portable archive
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Semantorium Semantorium-macOS-x86_64.zip
          ls -lh Semantorium-macOS-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semantorium-macOS-x86_64
          path: dist/Semantorium-macOS-x86_64.zip

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller Semantorium.spec --noconfirm

      - name: Create portable archive
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Semantorium Semantorium-macOS-arm64.zip
          ls -lh Semantorium-macOS-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Semantorium-macOS-arm64
          path: dist/Semantorium-macOS-arm64.zip
